<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Controle Uber e 99</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f0; --surface:#ffffff; --surface2:#e9ece6; --line:#d3d8d0;
  --text:#182025; --muted:#5a676e; --bar:#3c4950; --focus:#1a6fd1;
  --teal:#0b7d67; --teal-ink:#ffffff;
  --fill-teal:#10a284; --fill-amber:#e2a31f; --fill-coral:#dd5640; --fill-slate:#8c9ca5;
  --coral:#c23d29;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171a; --surface:#1b2125; --surface2:#242c31; --line:#313b41;
    --text:#edf0f1; --muted:#9aa7ae; --bar:#c9d2d7; --focus:#f0b232;
    --teal:#3fc3a5; --teal-ink:#0c1a16;
    --fill-teal:#3fc3a5; --fill-amber:#f0b232; --fill-coral:#ee7360; --fill-slate:#7d8f99;
    --coral:#f08573;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171a; --surface:#1b2125; --surface2:#242c31; --line:#313b41;
  --text:#edf0f1; --muted:#9aa7ae; --bar:#c9d2d7; --focus:#f0b232;
  --teal:#3fc3a5; --teal-ink:#0c1a16;
  --fill-teal:#3fc3a5; --fill-amber:#f0b232; --fill-coral:#ee7360; --fill-slate:#7d8f99;
  --coral:#f08573;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding:12px 16px 120px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 0 8px}
.top h1{margin:0;font-size:18px;font-weight:600}
.top span{color:var(--muted);font-size:14px}

/* hero */
.hero{padding:8px 0 20px}
.cap{margin:0;color:var(--muted);font-size:15px;font-weight:500}
.big{
  margin:2px 0 0;font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  font-weight:600;font-size:clamp(52px,17vw,72px);line-height:1.02;letter-spacing:-.01em;
}
.big.neg{color:var(--coral)}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.split{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden;background:var(--surface2);margin:16px 0 12px}
.split span{display:block;min-width:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:15px}
.legend>div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.legend .full{grid-column:1 / -1;padding-bottom:8px;border-bottom:1px solid var(--line)}
.legend span{display:flex;align-items:center;color:var(--muted)}
.legend b{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;flex:none}

/* today */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:20px}
.stats3 span{display:block;color:var(--muted);font-size:13px;line-height:1.2;min-height:32px}
.stats3 b{display:block;font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-size:26px;font-weight:600;line-height:1.1;margin-top:2px}
.stats3 b.neg{color:var(--coral)}

/* form sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.sheet h2{margin:0 0 12px;font-size:18px;font-weight:600}
.chips{display:flex;gap:8px}
.chip{flex:1;min-height:48px;padding:0 10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:600}
.switch{margin-bottom:16px}
.fld{margin-bottom:14px;min-width:0}
.fld label,.lbl{display:block;margin-bottom:6px;font-size:14px;color:var(--muted);font-weight:500}
.fld small{display:block;margin-top:4px;color:var(--muted);font-size:13px}
input[type=text],input[type=date],input:not([type]),select,textarea{
  width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--text);font-size:16px;-webkit-appearance:none;appearance:none;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:110px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
input[type=file]{width:100%;font-size:15px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:12px;font-weight:600;font-size:17px;padding:0 16px;margin-top:8px}
.btn.primary{background:var(--teal);color:var(--teal-ink)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:transparent;color:var(--coral);border:1px solid var(--coral)}
.btn.armed{background:var(--coral);color:#fff;border-color:var(--coral)}
.note{padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:14px;margin-bottom:14px}
.note.warn{border:1px solid var(--fill-coral)}
.link{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;font-weight:600;font-size:inherit}

/* sections */
section.blk{margin-top:26px}
section.blk h3{margin:0 0 6px;font-size:18px;font-weight:600}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.hint{margin:8px 0 0;color:var(--muted);font-size:13px}
.plat{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.plat .r{text-align:right}
.plat small{display:block;color:var(--muted);font-size:13px}
.cat{padding:9px 0;border-bottom:1px solid var(--line)}
.cat .t{display:flex;justify-content:space-between;gap:12px}
.mini{height:6px;border-radius:3px;background:var(--surface2);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--fill-slate)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-bottom:20px;margin-top:10px}
.bar{flex:1;height:100%;position:relative;display:flex;align-items:flex-end;min-width:0}
.bar i{display:block;width:100%;background:var(--bar);border-radius:3px 3px 0 0}
.bar.fut i{opacity:.25}
.bar em{position:absolute;bottom:-20px;left:-4px;right:-4px;text-align:center;font-style:normal;font-size:12px;color:var(--muted)}

/* period nav */
.nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin:12px 0 8px}
.nav button{min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;font-size:14px;font-weight:500}
.nav button:disabled{opacity:.4;cursor:default}
.nav .lab{text-align:center;font-weight:600}

/* history */
ul.list{list-style:none;margin:0;padding:0}
.dh{display:flex;justify-content:space-between;gap:12px;margin:22px 0 4px;font-size:15px;font-weight:600}
.dh .neg{color:var(--coral)}
.dh small{font-weight:400;color:var(--muted);font-size:13px;margin-right:4px}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .l{min-width:0}
.item .l small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.item .r{text-align:right;flex:none}
.item .r b{display:block;font-weight:600}
.item .out{color:var(--coral)}
.acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.mini-btn{min-height:40px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;font-size:14px}
.mini-btn.armed{background:var(--coral);border-color:var(--coral);color:#fff}
.empty{padding:28px 4px;color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;min-height:56px;background:none;border:0;color:var(--muted);font-weight:500;font-size:15px;position:relative}
.tab[aria-current="page"]{color:var(--text);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;left:22%;right:22%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--fill-teal)}

#toast{
  position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--text);color:var(--bg);
  font-size:15px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:10;text-align:center;
}
#toast.show{opacity:1}
#toast.err{background:var(--coral);color:#fff}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<noscript>Este app precisa de JavaScript ativado.</noscript>
<div class="app">
  <header class="top"><h1>Ganhos e gastos</h1><span id="today-lbl"></span></header>
  <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<nav class="tabbar" aria-label="Seções">
  <div class="tabs">
    <button type="button" class="tab" data-a="tab" data-v="hoje">Hoje</button>
    <button type="button" class="tab" data-a="tab" data-v="hist">Histórico</button>
    <button type="button" class="tab" data-a="tab" data-v="resumo">Resumo</button>
    <button type="button" class="tab" data-a="tab" data-v="backup">Backup</button>
  </div>
</nav>

<script>
(function(){
'use strict';

/* ---------- constantes ---------- */
var KEY='controle-uber-99-v1';
var CATS=['Combustível','Manutenção','Lavagem','Pedágio e estacionamento','Alimentação','Internet e celular','Multas','Outros'];
var PLATS=['Uber','99','Outra'];
var DOW=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var storageOK=true;

/* ---------- utilidades ---------- */
var pad=function(n){return String(n).padStart(2,'0');};
var fmtDate=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parseDate=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12);};
var todayStr=function(){return fmtDate(new Date());};
var addDays=function(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);};
var addMonths=function(s,n){var d=parseDate(s);return fmtDate(new Date(d.getFullYear(),d.getMonth()+n,1,12));};
var weekStart=function(s){var d=parseDate(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmtDate(d);};
var monthStart=function(s){return s.slice(0,8)+'01';};
var monthEnd=function(s){var d=parseDate(s);return fmtDate(new Date(d.getFullYear(),d.getMonth()+1,0,12));};
var isDate=function(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parseDate(s).getTime());};
var shortD=function(s){return s.slice(8)+'/'+s.slice(5,7);};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var el=function(id){return document.getElementById(id);};
var DASH='—';

var brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
var num1=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
var num2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
var money=function(v){return brl.format(Math.abs(v)<0.005?0:v);};
var fmtIn=function(n){return n?String(n).replace('.',','):'';};

function parseNum(v){
  if(v==null) return 0;
  var s=String(v).trim().replace(/\s/g,'').replace(/^R\$/,'');
  if(!s) return 0;
  if(s.indexOf(',')>=0){s=s.replace(/\./g,'').replace(',','.');}
  var n=Number(s);
  return isFinite(n)?n:0;
}

/* ---------- dados ---------- */
function normalize(o){
  var s={version:1,settings:{rent:500,rentDow:1,rentStart:weekStart(todayStr()),lastBackup:null},days:[],expenses:[]};
  if(!o||typeof o!=='object') return s;
  var st=o.settings||{};
  if(st.rent!==undefined&&st.rent!==null&&st.rent!==''&&isFinite(+st.rent)&&+st.rent>=0) s.settings.rent=+st.rent;
  if(st.rentDow!==undefined&&st.rentDow!==null&&[0,1,2,3,4,5,6].indexOf(+st.rentDow)>=0) s.settings.rentDow=+st.rentDow;
  if(isDate(st.rentStart)) s.settings.rentStart=st.rentStart;
  if(isDate(st.lastBackup)) s.settings.lastBackup=st.lastBackup;
  var n=function(v){v=+v;return isFinite(v)&&v>0?v:0;};
  (Array.isArray(o.days)?o.days:[]).forEach(function(x){
    if(!x||!isDate(x.date)) return;
    s.days.push({
      id:(typeof x.id==='string'&&x.id)?x.id:uid(),
      date:x.date,
      platform:PLATS.indexOf(x.platform)>=0?x.platform:'Outra',
      hours:n(x.hours),km:n(x.km),rides:Math.round(n(x.rides)),
      gross:n(x.gross),bonus:n(x.bonus),
      note:typeof x.note==='string'?x.note.slice(0,200):''
    });
  });
  (Array.isArray(o.expenses)?o.expenses:[]).forEach(function(x){
    if(!x||!isDate(x.date)) return;
    s.expenses.push({
      id:(typeof x.id==='string'&&x.id)?x.id:uid(),
      date:x.date,
      category:CATS.indexOf(x.category)>=0?x.category:'Outros',
      amount:n(x.amount),liters:n(x.liters),
      note:typeof x.note==='string'?x.note.slice(0,200):''
    });
  });
  return s;
}

function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){storageOK=false;return normalize(null);}
  if(raw){
    try{return normalize(JSON.parse(raw));}
    catch(e){try{localStorage.setItem(KEY+'-corrompido',raw);}catch(_){}}
  }
  var s=normalize(null);
  try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){storageOK=false;}
  return s;
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}
  catch(e){storageOK=false;}
}

var S=load();
var view={tab:'hoje',form:'dia',plat:'Uber',cat:'Combustível',period:'semana',anchor:todayStr(),hist:'tudo',histLimit:60,editing:null,formDate:null,showText:null};

/* ---------- cálculos ---------- */
function countRent(a,b){
  var st=S.settings;
  var from=a>st.rentStart?a:st.rentStart;
  if(!st.rent||from>b) return 0;
  var d=parseDate(from),end=parseDate(b),n=0;
  while(d<=end){if(d.getDay()===st.rentDow) n++;d.setDate(d.getDate()+1);}
  return n;
}
function summarize(a,b){
  var r={a:a,b:b,gross:0,hours:0,km:0,rides:0,other:0,fuel:0,liters:0,fuelMissing:0,byCat:{},byPlat:{},daily:{}};
  S.days.forEach(function(x){
    if(x.date<a||x.date>b) return;
    var g=x.gross+x.bonus;
    r.gross+=g;r.hours+=x.hours;r.km+=x.km;r.rides+=x.rides;
    var p=r.byPlat[x.platform]||(r.byPlat[x.platform]={gross:0,hours:0});
    p.gross+=g;p.hours+=x.hours;
    r.daily[x.date]=(r.daily[x.date]||0)+g;
  });
  S.expenses.forEach(function(x){
    if(x.date<a||x.date>b) return;
    r.byCat[x.category]=(r.byCat[x.category]||0)+x.amount;
    if(x.category==='Combustível'){r.fuel+=x.amount;r.liters+=x.liters;if(!x.liters) r.fuelMissing++;}
    else r.other+=x.amount;
  });
  var today=todayStr();
  r.rentN=countRent(a,b<today?b:today);
  r.rent=r.rentN*S.settings.rent;
  r.spent=r.fuel+r.other+r.rent;
  r.net=r.gross-r.spent;
  return r;
}
function rangeFor(){
  if(view.period==='semana'){var a=weekStart(view.anchor);return [a,addDays(a,6)];}
  if(view.period==='mes'){return [monthStart(view.anchor),monthEnd(view.anchor)];}
  var all=S.days.concat(S.expenses).map(function(x){return x.date;}).sort();
  var t=todayStr();
  var first=all.length?all[0]:t;
  var last=all.length&&all[all.length-1]>t?all[all.length-1]:t;
  return [first,last];
}

/* ---------- feedback ---------- */
var toastTimer=null;
function flash(msg,type){
  var t=el('toast');
  t.textContent=msg;
  t.className='show'+(type==='err'?' err':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.className='';},3200);
}
function twoStep(btn,run){
  if(btn.dataset.armed==='1'){run();return;}
  btn.dataset.armed='1';
  var old=btn.textContent;
  btn.textContent='Toque de novo';
  btn.classList.add('armed');
  setTimeout(function(){
    if(btn.isConnected&&btn.dataset.armed==='1'){
      btn.dataset.armed='';btn.textContent=old;btn.classList.remove('armed');
    }
  },4000);
}

/* ---------- visual: peças ---------- */
function hero(r,title,range){
  var total=Math.max(r.gross,r.spent);
  var seg=function(v,c){return (total>0&&v>0)?'<span style="width:'+(v/total*100).toFixed(2)+'%;background:var(--'+c+')"></span>':'';};
  var lg=function(c,l,v){return '<div><span><i class="dot" style="background:var(--'+c+')"></i>'+l+'</span><b>'+money(v)+'</b></div>';};
  return '<section class="hero">'+
    '<p class="cap">'+title+'</p>'+
    '<p class="big'+(r.net<0?' neg':'')+'">'+money(r.net)+'</p>'+
    '<p class="sub">'+range+'. '+(r.rentN?'Aluguel já descontado.':'Sem cobrança de aluguel neste período.')+'</p>'+
    '<div class="split" role="img" aria-label="Divisão do ganho bruto entre lucro e gastos">'+
      seg(Math.max(0,r.net),'fill-teal')+seg(r.fuel,'fill-amber')+seg(r.rent,'fill-coral')+seg(r.other,'fill-slate')+
    '</div>'+
    '<div class="legend">'+
      '<div class="full"><span>Ganho bruto</span><b>'+money(r.gross)+'</b></div>'+
      lg('fill-amber','Combustível',r.fuel)+lg('fill-coral','Aluguel',r.rent)+
      lg('fill-slate','Outros gastos',r.other)+lg('fill-teal','Lucro',r.net)+
    '</div></section>';
}
function fld(id,label,attrs,hint){
  return '<div class="fld"><label for="'+id+'">'+label+'</label><input id="'+id+'" '+attrs+' autocomplete="off">'+(hint?'<small>'+hint+'</small>':'')+'</div>';
}
function editRec(kind){
  if(!view.editing||view.editing.kind!==kind) return null;
  var list=kind==='dia'?S.days:S.expenses;
  for(var i=0;i<list.length;i++){if(list[i].id===view.editing.id) return list[i];}
  return null;
}
function banners(){
  var h='';
  if(!storageOK){
    h+='<div class="note warn">Este navegador não deixa salvar dados (aba privada, talvez). O que você lançar some ao fechar a página. Use a aba Backup para guardar uma cópia.</div>';
  }
  var n=S.days.length+S.expenses.length;
  if(storageOK&&n>=3){
    var lb=S.settings.lastBackup;
    var dd=lb?Math.floor((parseDate(todayStr())-parseDate(lb))/864e5):null;
    if(lb===null||dd>14){
      h+='<div class="note">'+(lb?'Seu último backup foi há '+dd+' dias.':'Você ainda não fez backup.')+

    }
  }
  return h;
}

function histHTML(){
  var items=[];
  if(view.hist!=='gasto') S.days.forEach(function(x){items.push(Object.assign({k:'dia'},x));});
  if(view.hist!=='dia') S.expenses.forEach(function(x){items.push(Object.assign({k:'gasto'},x));});
  items.sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?1:-1;
    if(a.k!==b.k) return a.k==='dia'?-1:1;
    return 0;
  });
  var chips='<div class="chips" role="group" aria-label="Filtro">'+
    [['tudo','Tudo'],['dia','Corridas'],['gasto','Gastos']].map(function(p){
      return '<button type="button" class="chip" data-a="hist" data-v="'+p[0]+'" aria-pressed="'+(view.hist===p[0])+'">'+p[1]+'</button>';
    }).join('')+'</div>';
  if(!items.length){
    return chips+'<p class="empty">Nada lançado ainda. Na aba Hoje, salve o primeiro dia de corridas ou o primeiro gasto.</p>';
  }
  var shown=items.slice(0,view.histLimit);
  var html='',cur=null,group=[];
  var flush=function(){
    if(cur===null) return;
    var net=0;
    group.forEach(function(x){net+=x.k==='dia'?(x.gross+x.bonus):-x.amount;});
    var lab=cap(parseDate(cur).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}));
    html+='<h3 class="dh"><span>'+lab+'</span><span class="'+(net<0?'neg':'')+'"><small>saldo</small>'+money(net)+'</span></h3><ul class="list">'+group.map(rowHTML).join('')+'</ul>';
  };
  shown.forEach(function(x){
    if(x.date!==cur){flush();cur=x.date;group=[];}
    group.push(x);
  });
  flush();
  if(items.length>shown.length){
    html+='<button type="button" class="btn ghost" data-a="more">Mostrar mais</button>';
  }
  return chips+html;
}

function dailyChart(r){
  if(view.period==='tudo') return '';

  while(d<=r.b){days.push(d);d=addDays(d,1);}
  var max=1;
  days.forEach(function(x){if((r.daily[x]||0)>max) max=r.daily[x];});
  var t=todayStr();
  var bars=days.map(function(x,i){
    var v=r.daily[x]||0;
    var h=Math.max(2,Math.round(v/max*100));
    var lab=view.period==='semana'?parseDate(x).toLocaleDateString('pt-BR',{weekday:'narrow'}):(i%7===0?String(+x.slice(8)):'');
    return '<div class="bar'+(x>t?' fut':'')+'"><i style="height:'+h+'%"></i><em>'+lab+'</em></div>';
  }).join('');

/* ---------- exportar / importar ---------- */
function toCSV(){
  var q=function(v){var s=String(v==null?'':v);return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  var safe=function(s){return /^[=+\-@]/.test(s)?"'"+s:s;};
  var n=function(v){return String(v).replace('.',',');};
  var head=['Tipo','Data','Plataforma ou categoria','Horas online','Km rodados','Corridas','Ganho no app (R$)','Gorjetas e bônus (R$)','Gasto (R$)','Litros','Observação'];
  var rows=[];
  S.days.forEach(function(x){rows.push([x.date,['Corridas',x.date,x.platform,n(x.hours),n(x.km),x.rides,n(x.gross),n(x.bonus),'','',safe(x.note)]]);});
  S.expenses.forEach(function(x){rows.push([x.date,['Gasto',x.date,x.category,'','','','','',n(x.amount),x.liters?n(x.liters):'',safe(x.note)]]);});
  rows.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0;});
  return '\uFEFF'+[head].concat(rows.map(function(r){return r[1];})).map(function(r){return r.map(q).join(';');}).join('\r\n');
}
function anchorDownload(name,text,mime){
  var blob=new Blob([text],{type:mime+';charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}
async function saveFile(name,text,mime){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      var dl=await window.claude.use('downloads');
      if(dl){
        try{await dl.save({filename:name,data:text});return 'ok';}
        catch(e){if(e&&e.code==='declined') return 'declined';}
      }
    }
  }catch(e){}
  try{anchorDownload(name,text,mime);return 'ok';}catch(e){return 'fail';}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  try{
    var ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    var ok=document.execCommand('copy');ta.remove();return ok;
  }catch(e){return false;}
}

function doImport(replace){
  var raw=el('imp-text')?el('imp-text').value.trim():'';
  if(!raw){flash('Cole o texto do backup ou escolha um arquivo.','err');return;}
  var o;
  try{o=JSON.parse(raw);}catch(e){flash('Esse texto não parece um backup válido.','err');return;}
  if(!o||typeof o!=='object'||(!Array.isArray(o.days)&&!Array.isArray(o.expenses))){flash('Não encontrei lançamentos nesse backup.','err');return;}
  var n=normalize(o);
  if(replace){S=n;}
  else{
    var di={},ei={},addD=0,addE=0;
    S.days.forEach(function(x){di[x.id]=1;});
    S.expenses.forEach(function(x){ei[x.id]=1;});
    n.days.forEach(function(x){if(!di[x.id]){S.days.push(x);addD++;}});
    n.expenses.forEach(function(x){if(!ei[x.id]){S.expenses.push(x);addE++;}});
    persist();flash('Importados: '+addD+' dias e '+addE+' gastos.');render(true);return;
  }
  persist();flash('Backup restaurado.');render(true);
}

  view.editing=null;view.formDate=rec.date;view.cat=rec.category;
  persist();
  flash(fuel&&!rec.liters?'Gasto salvo. Sem litros, esse abastecimento não entra no km/l.':(e?'Alterações salvas.':'Gasto salvo.'));
  render();
}

/* ---------- render ---------- */
function render(keepScroll){
  var m=el('main');
  var v=view.tab;
  m.innerHTML=v==='hoje'?hojeHTML():v==='hist'?histHTML():v==='resumo'?resumoHTML():backupHTML();
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    if(tabs[i].dataset.v===v) tabs[i].setAttribute('aria-current','page'); else tabs[i].removeAttribute('aria-current');
  }
  if(v==='hoje') syncFuel();
  if(!keepScroll) window.scrollTo(0,0);
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]');
  if(!b) return;
  var a=b.dataset.a;
  switch(a){
    case 'tab':
      view.tab=b.dataset.v;view.editing=null;view.formDate=null;view.showText=null;
      render();break;
    case 'form':
      view.form=b.dataset.v;view.editing=null;render(true);break;
    case 'plat':
      view.plat=b.dataset.v;
      Array.prototype.forEach.call(b.parentNode.querySelectorAll('[data-a="plat"]'),function(x){x.setAttribute('aria-pressed',String(x===b));});
      break;
    case 'save-dia':saveDia();break;
    case 'save-gasto':saveGasto();break;
    case 'cancel-edit':view.editing=null;render(true);break;
    case 'hist':view.hist=b.dataset.v;view.histLimit=60;render(true);break;
    case 'more':view.histLimit+=60;render(true);break;
    case 'period':view.period=b.dataset.v;view.anchor=todayStr();render(true);break;
    case 'nav':{
      var dir=+b.dataset.v;
      view.anchor=view.period==='semana'?addDays(view.anchor,7*dir):addMonths(view.anchor,dir);
      render(true);break;
    }
    case 'edit':{
      var kind=b.dataset.k;
      var list=kind==='dia'?S.days:S.expenses;
      var rec=null;
      for(var i=0;i<list.length;i++){if(list[i].id===b.dataset.id) rec=list[i];}
      if(!rec) break;
      view.tab='hoje';view.form=kind;view.editing={kind:kind,id:rec.id};
      if(kind==='dia') view.plat=rec.platform; else view.cat=rec.category;
      render();
      var fc=el('formcard');if(fc) fc.scrollIntoView({block:'start'});
      break;
    }
    case 'del':
      twoStep(b,function(){
        var list=b.dataset.k==='dia'?S.days:S.expenses;
        for(var i=0;i<list.length;i++){if(list[i].id===b.dataset.id){list.splice(i,1);break;}}
        persist();flash('Lançamento excluído.');render(true);
      });
      break;
    case 'export-json':
      saveFile('backup-controle-uber-99-'+todayStr()+'.json',JSON.stringify(S,null,1),'application/json').then(function(r){
        if(r==='ok'){markBackup();flash('Backup enviado para salvar.');render(true);}
        else if(r==='fail') flash('Não consegui gerar o arquivo. Use copiar como texto.','err');
      });
      break;
    case 'export-csv':
      saveFile('lancamentos-uber-99-'+todayStr()+'.csv',toCSV(),'text/csv').then(function(r){
        if(r==='ok') flash('Planilha enviada para salvar.');
        else if(r==='fail') flash('Não consegui gerar o arquivo. Use copiar como texto.','err');
      });
      break;
    case 'copy-json':{
      var txt=JSON.stringify(S);
      copyText(txt).then(function(ok){
        if(ok){markBackup();view.showText=null;flash('Backup copiado. Cole em um lugar seguro.');render(true);}
        else{view.showText=txt;render(true);flash('Não consegui copiar sozinho. Copie o texto da caixa.','err');}
      });
      break;
    }
    case 'imp-merge':doImport(false);break;
    case 'imp-replace':twoStep(b,function(){doImport(true);});break;
    case 'wipe':
      twoStep(b,function(){
        var keep=S.settings;
        S=normalize(null);S.settings.rent=keep.rent;S.settings.rentDow=keep.rentDow;S.settings.rentStart=keep.rentStart;
        persist();flash('Dados apagados.');render();
      });
      break;
  }
});
document.addEventListener('input',function(ev){
  var id=ev.target.id;
  if(id==='x-liters'||id==='x-amount') syncFuel();
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='x-cat'){view.cat=t.value;syncFuel();}
  else if(t.id==='s-rent'){S.settings.rent=Math.max(0,parseNum(t.value));persist();flash('Valor do aluguel salvo.');}
  else if(t.id==='s-dow'){S.settings.rentDow=+t.value;persist();flash('Dia da cobrança salvo.');}
  else if(t.id==='s-start'){if(isDate(t.value)){S.settings.rentStart=t.value;persist();flash('Data de início salva.');}}
  else if(t.id==='imp-file'){
    var f=t.files&&t.files[0];
    if(f){
      var rd=new FileReader();
      rd.onload=function(){var ta=el('imp-text');if(ta){ta.value=String(rd.result);flash('Arquivo carregado. Escolha como importar.');}};
      rd.readAsText(f);
    }
  }
});

el('today-lbl').textContent=cap(new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}));
render(true);
})();
</script>
</body>
</html>
